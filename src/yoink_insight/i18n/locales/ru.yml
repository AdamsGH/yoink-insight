commands:
  - {command: about,          description: "Описание YouTube видео",          scope: default}
  - {command: summary,        description: "Краткое содержание YouTube видео", scope: default}
  - {command: tldr,           description: "Краткое содержание любой ссылки (+ max / nobullshit / tale)", scope: default}
  - {command: insight_lang,   description: "Язык ответов Insight",            scope: private}
  - {command: insight_grant,  description: "Выдать доступ к Insight",         scope: private, min_role: admin}
  - {command: insight_revoke, description: "Отозвать доступ к Insight",       scope: private, min_role: admin}
  - {command: insight_list,   description: "Список доступа к Insight",        scope: private, min_role: admin}

help_sections:
  insight:
    title: "AI Аналитика"
    footer: "Команды видны только пользователям с доступом к Insight."
  tldr:
    title: "TLDR"
    footer: "Краткое содержание любой ссылки или YouTube-видео. Требует отдельного доступа.\nМодификаторы: `max` - подробно и детально; `nobullshit` - дворф-критик, без воды; `tale` - связный пересказ от дворфа-рассказчика.\nСвои алиасы - в настройках AI."
  admin_insight:
    title: "Управление Insight"

