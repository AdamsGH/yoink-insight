[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoink-insight"
version = "0.3.5"
requires-python = ">=3.12"
dependencies = [
    "yoink-core>=0.1.0",
    "pydantic-settings>=2.7",
    "google-genai>=1.10",
    "youtube-transcript-api>=1.0",
    "trafilatura>=2.0.0",
    "readability-lxml>=0.8.4",
    "markdown-it-py>=4.0",
    "toon_format @ git+https://github.com/toon-format/toon-python.git",
    "PyGithub>=2.9",
    "beautifulsoup4>=4.12",
]

[project.entry-points."yoink.plugins"]
insight = "yoink_insight:InsightPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
# Plugins live in a monorepo: the real interpreter + deps are at the repo root,
# and cross-plugin/core imports resolve via explicit search paths.
python-interpreter-path = "../../.venv/bin/python"
search-path = [
    "src",
    "../../src",
    "../yoink-dl/src",
    "../yoink-music/src",
    "../yoink-stats/src",
]
ignore-missing-imports = ["pytest", "pytest_asyncio"]
